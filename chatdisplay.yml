settings:
  enabled: true

# ── Item display: shows the held item with its native hover tooltip ────────────
item-display:
  enabled: true
  triggers:
    - '[i]'
  cooldown: 30
  format: '<gray>[<white>%item%<gray>%amount%]'
  amount-format: ' <gray>x<white>%amount%'
  permission: 'lotuschat.display.item'

# ── Item menu display: shows a clickable chat link that opens an item preview menu ──
item-menu-display:
  enabled: true
  triggers:
    - '[item]'
  cooldown: 30
  expire-seconds: 300
  format: '<gray>[<white>%item%<gray>]'
  hover:
    - '<gray>Click to view'
    - "<white>%player%<gray>'s item"
  permission: 'lotuschat.display.itemmenu'
  menu:
    title: "<dark_gray>%player%<gray>'s Item"
    filler:
      material: 'GRAY_STAINED_GLASS_PANE'
      name: ' '

# ── Inventory display: shows a clickable chat link that opens a player's inventory ──
inventory-display:
  enabled: true
  triggers:
    - '[inv]'
    - '[inventory]'
  cooldown: 30
  expire-seconds: 300
  format: "<green>[<white>%player%<green>'s Inventory]"
  hover:
    - '<gray>Click to view'
    - "<white>%player%<gray>'s inventory"
  permission: 'lotuschat.display.inventory'
  menu:
    title: "<dark_gray>%player%<gray>'s Inventory"
    filler:
      material: 'GRAY_STAINED_GLASS_PANE'
      name: ' '

# ── Ender chest display: shows a clickable chat link that opens a player's ender chest ──
enderchest-display:
  enabled: true
  triggers:
    - '[ec]'
    - '[enderchest]'
  cooldown: 30
  expire-seconds: 300
  format: "<dark_purple>[<white>%player%<dark_purple>'s Ender Chest]"
  hover:
    - '<gray>Click to view'
    - "<white>%player%<gray>'s ender chest"
  permission: 'lotuschat.display.enderchest'
  menu:
    title: "<dark_gray>%player%<gray>'s Ender Chest"

# ── Custom displays: define your own triggers with hover text and PlaceholderAPI support ──
custom-displays:
  stats:
    enabled: true
    triggers:
      - '[stats]'
    cooldown: 20
    format: "<red>[<white>%player%<red>'s Stats]"
    hover:
      - ''
      - '<gray>➛ <red>%player%'
      - ''
      - '<dark_gray>▪ <gray>Kills: <red>%statistic_player_kills%'
      - '<dark_gray>▪ <gray>Deaths: <red>%statistic_deaths%'
      - '<dark_gray>▪ <gray>Level: <green>%player_level%'
      - '<dark_gray>▪ <gray>XP: <green>%player_exp%'
      - '<dark_gray>▪ <gray>Health: <green>%player_health%<dark_gray>/<green>%player_max_health%'
      - ''
    permission: 'lotuschat.display.stats'

  ping:
    enabled: true
    triggers:
      - '[ping]'
    cooldown: 10
    format: "<aqua>[<white>%player%<aqua>'s Ping]"
    hover:
      - ''
      - "<white>%player%<gray>'s ping"
      - '<gray>is <aqua>%player_ping%ms'
      - ''
    permission: 'lotuschat.display.ping'
