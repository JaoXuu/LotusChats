settings:
  enabled: true
  # How %lotuschat_tag% is rendered in chatformat.yml / chatchannel.yml when the
  # player has a tag selected (%tag% = the tag). Players with no tag get an empty string.
  placeholder-format: '%tag% '

# The /tags menu.
menu:
  title: '<dark_gray>» <gold>Tags <dark_gray>«'
  # Multiple of 9, max 54.
  size: 45
  # Item used for every tag unless the tag sets its own 'material'.
  material: NAME_TAG
  # %status% placeholder available in each tag's lore.
  status:
    selected: '<green>✔ Selected'
    available: '<yellow>➜ Click to select'
    locked: '<red>✘ Locked'
  navigation:
    remove-tag:
      slot: 39
      material: BARRIER
      name: '<red>Remove tag'
      lore:
        - '<gray>Click to stop using your tag.'
    close:
      slot: 41
      material: ARROW
      name: '<gray>Close'
      lore: []

# Each tag:
#   name:       item name shown in the menu
#   lore:       item lore (%tag% = the tag preview, %status% = selected / available / locked)
#   slot:       slot in the menu
#   permission: permission required to use it ('' = everyone)
#   tag:        the text shown in chat through %lotuschat_tag%
#   material:   (optional) item for this tag, overrides menu.material
#
# The default symbols are part of the basic Unicode range, so they load and render
# on every version (1.8 → latest). Avoid emojis (crown, fire, etc.) if you run 1.8-1.12:
# the YAML parser of those versions can't read them (not even inside a comment) and
# the whole file fails to load.
tags:
  star:
    name: '<yellow>★ Star'
    lore:
      - ''
      - '<gray>Preview: %tag%'
      - ''
      - '%status%'
    slot: 10
    permission: 'lotuschat.tags.star'
    tag: '<dark_gray>[<yellow>★<dark_gray>]'
